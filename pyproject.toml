[project]
name = "sports-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jakeostdiek", email = "jrostdiek@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain[anthropic]>=1.3.15",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
sports-agent = "sports_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
